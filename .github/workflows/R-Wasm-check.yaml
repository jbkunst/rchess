on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: R-Wasm-check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  R-Wasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build package for WebAssembly
        run: |
          docker run --rm \
            -v "$PWD:/github/workspace" \
            -w /github/workspace \
            ghcr.io/r-wasm/webr:v0.6.0 \
            bash -lc '
              rm -f /etc/apt/sources.list.d/rig.list
              Rscript -e "rwasm::add_pkg(\".\", repo_dir = \"_site\", remotes = NULL, compress = TRUE); rwasm::make_vfs_library(out_dir = \".\", repo_dir = \"_site\", compress = TRUE)"
            '
